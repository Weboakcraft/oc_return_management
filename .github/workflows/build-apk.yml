name: Build Android APK

# Builds the Return Desk app. Run it by hand from the Actions tab, or push a
# tag like v1.0.0 to cut a release build.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Apps Script /exec URL to bake into this build (leave blank to use the repository variable)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Stage the web app
        working-directory: mobile
        env:
          # Precedence: the value typed when running the workflow, then the
          # repository variable RETURN_DESK_API_URL, then whatever is in
          # frontend/js/config.js.
          RETURN_DESK_API_URL: ${{ github.event.inputs.api_url || vars.RETURN_DESK_API_URL }}
        run: npm run web

      - name: Create the Android project
        working-directory: mobile
        run: npx cap add android

      - name: Generate launcher icons and splash screens
        working-directory: mobile
        run: npx @capacitor/assets generate --android --assetPath resources

      - name: Sync web assets into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Read the version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: return-desk-debug-${{ steps.version.outputs.name }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------------
      # Signed release build. Only runs once the four signing secrets are
      # set; until then the debug APK above is enough to install and test.
      # ----------------------------------------------------------------
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore configured. Skipping the release build."
          fi

      - name: Restore the keystore
        if: steps.signing.outputs.ready == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      - name: Build the signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file=app/$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload the release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: return-desk-release-${{ steps.version.outputs.name }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: false
