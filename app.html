<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return Desk</title>
<meta name="description" content="Return management and analytics for ecommerce operations.">
<meta name="theme-color" content="#0e3b3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Return Desk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="rail__brand" id="brand">
      <strong>Return Desk</strong>
    </div>
    <nav class="rail__nav" id="rail-nav" aria-label="Sections"></nav>
    <div class="rail__foot">
      <div id="install-slot" class="hidden" data-button-class="btn btn--sm btn--block" style="margin-bottom:10px"></div>
      <button type="button" id="signout">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
      <span class="topbar__title" id="topbar-title">Dashboard</span>
      <input type="search" id="global-search" class="input" style="max-width:280px;min-height:36px"
             placeholder="Search returns, press Enter" aria-label="Search returns">
      <div class="topbar__user" id="topbar-user"></div>
    </header>

    <main class="view" id="view"></main>
  </div>

  <!-- Phone only: the sections people use all day, within thumb reach. -->
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<div id="toasts" class="toasts"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/validation.js"></script>
<script src="js/charts.js"></script>
<script src="js/voice.js"></script>
<script src="js/photos.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/returns.js"></script>
<script src="js/pending.js"></script>
<script src="js/repair.js"></script>
<script src="js/production.js"></script>
<script src="js/analytics.js"></script>
<script src="js/reports.js"></script>
<script src="js/admin.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
